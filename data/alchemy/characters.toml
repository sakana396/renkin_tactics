# 自軍のキャラ（新作の試作。DES-NG-06）
# 名前・性別・性格は開発者が決めるまでの仮のもの（企画たたき台 Q-5）。物語では性別を示す言い方をしない
# 手持ちは、回復薬を先頭にそろえる（準備の画面での並びと、既存の作品との一貫性のため。爆弾は後ろ）
# 手持ちの枠は、武器の本数と道具の個数の合計で 5 まで

# 主人公（錬金術師。薬師の家の生まれ）。後衛。初めの手持ちに爆弾を持つ
[[characters]]
id = "aoi"
name = "アオイ"
class = "alchemist"
bonus = { hp = 0, str = 0, skl = 0, spd = 0, def = 0, mov = 0 }
growth = { hp = 50, str = 10, skl = 45, spd = 45, def = 15, lck = 35, mag = 50, res = 35 }
# 主人公は、攻撃の魔法に加えて、癒やしの杖も持つ（開発者の依頼、2026-11-13）。手持ちは武器 2 本 ＋ 道具 3 個で、上限の 5 枠。
# 小さな爆弾の 1 個は、枠の都合で名簿から外し、全体の在庫（game.toml の stock）に入れた（準備の画面で持たせられる）。
weapons = ["fire", "heal_staff"]
items = [{ item = "potion", count = 1 }, { item = "bomb_small", count = 1 }, { item = "bomb_large", count = 1 }]
lord = true

