# 物語（新作の試作 1〜3 章。DES-NG-06）。仮の文面で、開発者の確認を待つ
# 各段落は空でなく、200 文字以下。性別を示す三人称の代名詞は使わず、名前で書く
# 古代都市の滅びの原因は、ほのめかすだけにとどめる（企画たたき台 2.1 節）。死は重く描かない

[[stories]]
id = "ch01_before"
paragraphs = [
  "山あいの村ナギは、薬草と湧き水で暮らしてきた。その湧き水が、ここ数年で細くなった。今年の春には、一日分の水を汲むのに、朝から列ができるほどになった。",
  "アオイは、村の薬師の家に生まれた。家には、亡くなった祖母が残した古い調合帳がある。薬草の煎じ方のほかに、見たことのない記号と、水や石を扱う不思議な手順が、びっしりと書き込まれている。",
  "村の人は、その手順を「ばあさまの遊び」と呼んだ。役に立つのかどうかも分からないまま、祖母は晩年まで手を動かし続けた。アオイも、薬を煎じるついでに真似をするうちに、瓶の中の水が形を変えるのを見慣れていた。",
  "春の終わり、リューネ王国の役人が、村を訪ねてきた。ひびの入った小さな石の板を差し出して、こう言った。役人「これを動かしてみてほしい。国中の技師が試して、誰もできなかった」",
  "アオイは、調合帳の手順どおりに、板の欠けた部分を埋めるように薬を塗った。夜明けには、石の板は淡く光り、細い水を吐き出していた。役人は、しばらく言葉を失っていた。",
  "役人「古代都市トゥラーネの水路と浄水施設を、復旧してほしい。ナギの水も、あの都市の水路の末端だと分かった。水を戻せるのは、あなたしかいない」",
  "国の命令だと、役人は言った。けれどアオイは、国のためだと思ったわけではない。村の水が戻る。それだけで、荷をまとめるには十分だった。",
  "旅の道連れには、国から兵が付けられた。護衛の隊長ダインは、重い盾を背負った無口な人だった。ダイン「命じられたのは、あなたを都市まで無事に連れていくことだ。道中は、私の後ろにいてほしい」",
  "アオイ「前に立つのは苦手です。そのかわり、薬と、少しばかり『投げるもの』なら持ってきました」荷の中には、調合帳の記号どおりに作った、手のひら大の丸い包みが並んでいる。",
  "ダイン「それは、薬ですか」　アオイ「薬、のつもりです。割れると、辺りに広がります。投げるときは、離れていてください」　ダインは、無言でうなずいて、半歩だけ後ろへ下がった。",
  "護衛の部隊には、槍兵のトーリと、弓兵のネムもいた。二人は、旅の間に何度もアオイの包みを覗き込み、そのたびにダインに咳払いをされていた。",
  "七日目の昼、一行は山を越えた。谷の底に、苔むした石の城壁が見えた。トゥラーネ。ずっと昔に人が去った、古代の都市だ。",
  "城壁の一部は、内側から何かに食い荒らされたように、ごっそりと欠けていた。理由は、誰も知らない。石畳の間を走る水路は、どこも乾ききっていた。",
  "トーリ「入口の広場に、野盗が居座っています。水路の元栓は、その奥です」　ネム「通路が狭いので、あそこに固まっていますね」　アオイは、荷の中の包みを、一つ確かめた。",
  "アオイ「この水路を直さないと、村の水は戻りません」　ダイン「理由は何であれ、私の仕事は変わらない。行きましょう」",
]

[[stories]]
id = "ch01_after"
paragraphs = [
  "野盗が散ると、広場に静けさが戻った。ダインは、倒れた兵を並べて布をかけた。重い空気の中で、アオイは一人、水路の元栓の前に立った。",
  "元栓は、石でできた太い輪だった。表面に、調合帳にあるのと似た記号が、薄れながら刻まれている。アオイが手のひらを当てると、輪の奥で、かすかに水の音がした。",
  "アオイ「動く。まだ、動きます」　しばらくして、乾いた水路の底を、細い水が走り始めた。誰かが小さく歓声を上げ、ネムは何度も、水の行き先を目で追った。",
  "その夜、ダインが、焚き火の向こうで言った。ダイン「北の水路沿いに、煙が見えた。ヴェルセ公国の旗だ。先に、都市へ入った隊がいる」",
  "ヴェルセ公国。リューネの隣の国で、遺跡から掘り出した古い武器を、そのまま戦に使っていると聞く。アオイは、細い水の流れを見つめながら、調合帳の端をそっと撫でた。",
]

[[stories]]
id = "ch02_before"
paragraphs = [
  "水路は、都市の北へ向かって続いている。細い流れに沿って進むと、石の橋が三つ並ぶ場所に出た。橋の向こう岸には、ヴェルセ公国の兵が、すでに陣を敷いていた。",
  "そこへ、後ろの道から、小さな人影が走ってきた。ハルと名乗るその人は、ナギの村の薬師の家の者で、祖母に調合を習っていた、とアオイに告げた。",
  "ハル「村から、荷を追いかけてきました。その包みの作り方は、ばあさまに教わっています。手伝わせてください。杖も、少しなら使えます」",
  "アオイは、迷った。けれど、ハルの手の中の瓶は、アオイの作るものと同じ匂いがした。アオイ「向こう岸の兵を退けるまで、私の後ろにいてください」",
  "向こう岸の兵は、手にした槍を高く掲げている。穂先には、見慣れない文様が走り、陽を受けて鈍く光っていた。ダイン「あれが、掘り出した古い武器か。橋に、固まって来るぞ」",
  "ダイン「橋は一人しか通れない。私が前に出て、止める。アオイ、橋の向こうの端に敵が詰まったら、そこを狙え」　アオイは、荷の中から、大きな丸い包みを取り出した。",
]

[[stories]]
id = "ch02_after"
paragraphs = [
  "先遣隊の隊長が、膝をついた。ダインが、取り落とされた槍を拾い上げ、眉をひそめた。ダイン「重い。それに、冷たい」",
  "槍の文様に、アオイが指を触れた。その瞬間、足元の水路を流れる水が、ほんの少しだけ細くなった気がした。気のせいかもしれない。けれどアオイは、その槍から手を離した。",
  "ハル「この槍を使うと、水が減るんでしょうか」　アオイ「分かりません。けれど、あの兵たちは、この槍の使い方だけを知っていて、仕組みは知らないのかもしれません」",
  "生き残った公国の兵は、武器を捨てて北へ逃げた。捕らえた兵が、震える声で言った。「将軍が、浄水施設に入られた。あそこを押さえて、水を前線に送る、と」",
  "浄水施設。トゥラーネの水の源で、ナギの水を取り戻すために、アオイがどうしても直さなければならない場所だった。一行は、夜明けを待たずに北へ向かった。",
]

[[stories]]
id = "ch03_before"
paragraphs = [
  "都市の北、崩れた壁に囲まれた広場の奥に、浄水施設はあった。太い石の柱と、半ば砂に埋もれた水槽。その入口を、公国の兵が固めている。",
  "施設の前に立つ将軍ベルナドは、遠目にも分かるほど大柄だった。手にした槍には、先遣隊の兵と同じ文様がある。ベルナド「ここは公国のものになる。この水を、この先の戦の補給にする」",
  "ダイン「あれが将軍か。入口の前に兵を固めている。広場から近づけば、まとめて来るだろう」　ハル「入口の前に固まっているなら、包みの狙い目ですね」",
  "アオイ「あの施設を、直さなければなりません。止まった水の元は、あそこです」　ベルナドの視線が、アオイの肩の荷に向いた。ベルナド「その荷は、薬か」",
  "アオイ「薬です。割れると広がります」　ベルナドは、鼻で笑った。それから、自分の槍に目を落として、ぽつりと言った。ベルナド「この槍を振るうたびに、足元の石が冷たくなる。気のせいなら、いいのだが」",
  "それ以上、ベルナドは何も言わなかった。兵に向き直り、槍を高く掲げた。戦いの合図だった。",
]

[[stories]]
id = "ch03_after"
paragraphs = [
  "ベルナドが膝をつくと、公国の兵は、波が引くように施設の前から退いた。将軍は、槍を杖のようについて、立ち上がった。",
  "ベルナド「……引き上げる。だが、一つ聞かせてほしい。この槍を使うと、本当に、この都市は弱るのか」　アオイは、正直に答えた。アオイ「分かりません。けれど、水は確かに、細くなりました」",
  "ベルナドは、しばらく黙っていた。ベルナド「次に会うときは、剣を向けずに話せるといい。公国の上の者が、それを許せば、の話だが」　そう言い残し、将軍は兵を連れて去った。",
  "アオイは、施設の中へ入った。水槽の底に、元栓と同じ記号が並んでいる。調合帳をめくり、手順を一つずつ確かめながら、薬を塗り、石を組んでいった。",
  "どれほど経ったか、足元の水路を、澄んだ水が走り始めた。ナギの村まで届くには、まだ長い道のりがある。けれど、水は確かに、動き始めた。",
  "ハル「この都市には、まだたくさん直す場所がありますね」　ダイン「ああ。だが、今夜は休もう。明日のことは、明日考えればいい」　アオイは、調合帳の端に、今日の日付を書き込んだ。",
]
