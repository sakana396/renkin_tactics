# 物語（新作の 1〜3 章。DES-NG-06、#208）。仮の文面で、開発者の確認を待つ
# 各段落は空でなく、200 文字以下。性別を示す三人称の代名詞は使わず、名前で書く
# 古代都市の滅びの原因は、ほのめかすだけにとどめる（CON-001 3.2 節）。新作も戦争の話として死を描く（E-140）
# 戦死しうる仲間（主人公のほか）は、1 章の前と加入の場面のほかでは話さず動かない（DES-STY-01）

[[stories]]
id = "ch01_before"
paragraphs = [
  "山あいの村ナギは、薬草と湧き水で暮らしてきた。その湧き水が、ここ数年で細くなった。今年の春には、一日分の水を汲むのに、朝から列ができるほどになった。",
  "アオイは、村の薬師の家に生まれた。家には、亡くなった祖母が残した古い調合帳がある。薬草の煎じ方のほかに、見たことのない記号と、水や石を扱う不思議な手順が、びっしりと書き込まれている。",
  "村の人は、その手順を「ばあさまの遊び」と呼んだ。役に立つのかどうかも分からないまま、祖母は晩年まで手を動かし続けた。アオイも、薬を煎じるついでに真似をするうちに、瓶の中の水が形を変えるのを見慣れていた。",
  "春の終わり、リューネ王国の役人が、村を訪ねてきた。ひびの入った小さな石の板を差し出して、こう言った。役人「これを動かしてみてほしい。国中の技師が試して、誰もできなかった」",
  "アオイは、調合帳の手順どおりに、板の欠けた部分を埋めるように薬を塗った。夜明けには、石の板は淡く光り、細い水を吐き出していた。役人は、しばらく言葉を失っていた。",
  "役人「古代都市トゥラーネの水路と浄水施設を、復旧してほしい。ナギの水も、あの都市の水路の末端だと分かった。水を戻せるのは、あなたしかいない」",
  "国の命令だと、役人は言った。けれどアオイは、国のためだと思ったわけではない。村の水が戻る。それだけで、荷をまとめるには十分だった。",
  "旅の道連れには、国から兵が付けられた。護衛の隊長ダインは、重い盾を背負った無口な人だった。ダイン「命じられたのは、あなたを都市まで無事に連れていくことだ。道中は、私の後ろにいてほしい」",
  "アオイ「前に立つのは苦手です。そのかわり、薬と、少しばかり『投げるもの』なら持ってきました」荷の中には、調合帳の記号どおりに作った、手のひら大の丸い包みが並んでいる。",
  "ダイン「それは、薬ですか」　アオイ「薬、のつもりです。割れると、辺りに広がります。投げるときは、離れていてください」　ダインは、無言でうなずいて、半歩だけ後ろへ下がった。",
  "護衛の部隊には、槍兵のトーリと、弓兵のネムもいた。二人は、旅の間に何度もアオイの包みを覗き込み、そのたびにダインに咳払いをされていた。",
  "七日目の昼、一行は山を越えた。谷の底に、苔むした石の城壁が見えた。トゥラーネ。ずっと昔に人が去った、古代の都市だ。",
  "城壁の一部は、内側から何かに食い荒らされたように、ごっそりと欠けていた。理由は、誰も知らない。石畳の間を走る水路は、どこも乾ききっていた。",
  "トーリ「入口の広場に、野盗が居座っています。水路の元栓は、内門の奥です」　ネム「西の詰所にも、何人か固まっています。壁と水路の向こうなので、矢は届きませんね」　アオイは、荷の中の包みを、一つ確かめた。",
  "アオイ「この水路を直さないと、村の水は戻りません」　ダイン「理由は何であれ、私の仕事は変わらない。行きましょう」",
]

[[stories]]
id = "ch01_after"
paragraphs = [
  "頭目が倒れると、残った野盗は散り散りに逃げていった。広場の石畳には、逃げそびれた者たちが、動かずに横たわっていた。乾いた水路に、血の色が細く流れ込んでいた。",
  "アオイは、腰の包みに目を落とした。祖母の調合帳には、薬の煎じ方と同じ字で、この包みの作り方が書いてあった。薬と同じ手で作ったものを、人に向けて投げる。それが、この旅の仕事になった。",
  "倒れた野盗は、広場の隅に並べられ、布をかけられた。頭目の手から落ちた槍を、アオイは拾い上げた。穂先は鉄ではなく、青白い石のようなもので、刃こぼれ一つなかった。",
  "穂先には、細い記号が刻まれていた。調合帳にある記号と、よく似ている。古代都市の遺物を、誰かが掘り出して、そのまま武器に変えている。",
  "元栓は、石でできた太い輪だった。表面に、同じ記号が、薄れながら刻まれている。アオイが手のひらを当てると、輪の奥で、かすかに水の音がした。",
  "アオイ「動く。まだ、動きます」　しばらくして、乾いた水路の底を、細い水が走り始めた。広場のあちこちで、小さな歓声が上がった。",
  "その夜、見張りに立っていた兵が、北の水路沿いに煙が上がっているのを見つけた。煙の下にひるがえっていたのは、ヴェルセ公国の旗だった。",
  "ヴェルセ公国。リューネの隣の国で、遺跡から掘り出した古い武器を、そのまま戦に使っていると聞く。アオイは、昼に拾った槍の穂先を思い出しながら、調合帳の端をそっと撫でた。",
]

[[stories]]
id = "ch02_before"
paragraphs = [
  "北の水路に沿って進むと、壊れた水門のそばに人影があった。調合の見習いハルは、水をせき止める瓦礫を片付けようとしていた。",
  "ハル「村の水が戻ったと聞いて、上流を見に来ました。この水門も直せば、もっと遠くまで水が届くはずです」",
  "アオイが調合帳を開くと、ハルは見慣れない記号に目を留めた。ハル「手伝わせてください。薬を作ることなら、少しはできます」",
  "そのとき、水路の向こうにヴェルセ公国の兵が現れた。元栓を奪うため、二つの橋へ分かれて進んでくる。アオイは包みを握り、仲間とともに橋へ向かった。",
]

[[stories]]
id = "ch02_after"
paragraphs = [
  "隊長が倒れ、公国の兵は水路の向こうへ退いた。橋の上には、もう帰ることのない兵が残された。アオイは足を止め、その顔に布をかけた。",
  "水門の石には深い亀裂が走っていた。アオイが調合帳を頼りに継ぎ目を埋めると、水はゆっくりと門を越え、乾いた水路の先へ流れた。",
  "公国の旗はまだ北に見える。水を取り戻しても、戦いが終わったわけではなかった。",
]

[[stories]]
id = "ch03_before"
paragraphs = [
  "水門から先の水路は、古い浄水施設へ続いていた。水を村まで届けるには、施設の奥にある装置を動かさなければならない。",
  "だが施設には公国の兵が陣取り、両翼の高い壁の向こうから進入路を見張っていた。アオイは遠くを狙える投げ火を確かめ、施設へ向かった。",
]

[[stories]]
id = "ch03_after"
paragraphs = [
  "指揮官が倒れると、施設に残った兵は武器を捨てた。戦いで命を落とした兵たちを前に、アオイはしばらく調合帳を閉じたまま立っていた。",
  "施設の装置に刻まれた記号をたどり、傷んだ継ぎ目を直す。やがて濁っていた水が澄み、水路を伝って南へ流れ始めた。",
  "故郷まで水が届くには、まだ時間がかかる。アオイは水の流れを見送り、先へ続く水路と、遠くに残る公国の旗を見つめた。",
]
