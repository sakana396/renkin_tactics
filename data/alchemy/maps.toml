# マップ（新作「古代都市の復旧」。DES-NG-06）。記法は data/base/maps.toml と同じ
# rows の 1 文字が 1 マス（terrains.toml の symbol）。座標は左上が (0, 0)。slots の 1 番目は主人公の枠
# ボス（boss = true）を倒すと勝ち
# 1 章の設計と数値の根拠は docs/iterations/it08/map-ng-ch01.md（#208）

# 1 章「水の止まった都」: 古代都市の入口。南の広場から水路を渡り、内門の奥の元栓の間（ボス）を目指す。
# 爆弾を試せる場所は 3 つ: 西の詰所（壁と水路の向こうに 4 体が固まる。南岸 (3, 11) から壁越しに投げる）、
# 東の小隊長の一団（集まるところを狙う）、内門（門の奥に固まる守りと、門に立つ味方の巻き込み）
[[maps]]
id = "ch01"
name = "古代都市の入口"
rows = [
  "##################", # y 0
  "#R..............R#", # y 1  元栓の間
  "#...R...TT...R...#", # y 2  元栓（浄水施設）
  "#................#", # y 3
  "########..########", # y 4  内門（x = 8〜9）
  "######..F...R.R..#", # y 5  中の街区
  "##...#.....F..R..#", # y 6  西の詰所（x = 2〜4、y = 6〜8）
  "##......F.....RR.#", # y 7  詰所の戸口（5, 7）
  "##...#.......R...#", # y 8
  "######...F.......#", # y 9
  "~~~~~~~~..~~~~~.~~", # y 10 水路。中の橋（x = 8〜9）と東の橋（x = 15）
  "#.....R.....F....#", # y 11 南岸
  "#..F.........R...#", # y 12
  "#.......F.......F#", # y 13
  "#..R.........F...#", # y 14
  "#................#", # y 15
  "#.F............R.#", # y 16
  "##################", # y 17
]
# 出撃の枠。1 番目（主人公）は後ろの列の中央
slots = [
  { x = 8, y = 16 },
  { x = 7, y = 15 },
  { x = 9, y = 15 },
  { x = 8, y = 14 },
  { x = 7, y = 16 },
  { x = 9, y = 16 },
]

