# 2 章: 水路沿い。水路（x = 7）に橋が 3 つ（y = 4・8・12）。隣の国の先遣隊が東の岸から橋へ寄ってくる。
# 橋の東の端に敵が詰まるので、西の岸から爆弾を投げられる。橋は 1 マス幅で、重装兵が通せんぼで守れる
