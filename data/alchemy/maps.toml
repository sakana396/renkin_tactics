# マップ（新作の試作 1〜3 章。DES-NG-06）。記法は data/base/maps.toml と同じ
# rows の 1 文字が 1 マス（terrains.toml の symbol）。座標は左上が (0, 0)。slots の 1 番目は主人公の枠
# ボス（boss = true）を倒すと勝ち。新しい勝利条件・出来事・増援は使わない

# 1 章: 古代都市の入口。狭い通路（x = 6〜7、y = 3〜5）に野盗が固まっている。
# 水路（y = 9）を橋（x = 6〜7）で渡り、通路の手前の広場（y = 6〜8）から爆弾で通路を狙う
[[maps]]
id = "ch01"
name = "古代都市の入口"
rows = [
  "################", # y 0
  "#..R........R..#", # y 1  ボスの間
  "#..............#", # y 2
  "######..########", # y 3  狭い通路
  "######..########", # y 4
  "######..########", # y 5
  "#..............#", # y 6  広場
  "#.RR......F.R..#", # y 7
  "#..F...........#", # y 8
  "~~~~~~..~~~~~~~~", # y 9  水路と橋
  "#.......F......#", # y 10
  "#..R...........#", # y 11
  "#..............#", # y 12
  "#....F.........#", # y 13
  "#..............#", # y 14
  "################", # y 15
]
slots = [
  { x = 6, y = 14 },
  { x = 5, y = 13 },
  { x = 7, y = 13 },
  { x = 4, y = 14 },
  { x = 8, y = 14 },
  { x = 6, y = 12 },
]

# 広場の野盗（寄ってくる）
[[maps.enemies]]
class = "bandit"
weapon = "iron_sword"
level = 1
ai = "charge"
x = 4
y = 7

