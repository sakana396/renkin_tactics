# マップ（DES-DAT-02、設計書（反復 1）10.4 節、設計書（反復 2）10.4〜10.6 節）
# rows の 1 文字が 1 マス（地形の symbol）。座標は左上が (0, 0) で、x は右、y は下に増える
# slots は出撃の枠の並び。1 番目は主人公の枠
# ai は charge（突っ込む）・hold（待ち構える）のどれか。name は敵の名前（省略すると、クラスの名前から付ける）

[[maps]]
id = "ch01"
name = "国境の砦"
rows = [
  "^^^^^^..FFF..^^^", # y 0
