# マップ（DES-DAT-02、設計書 10.4 節）
# rows の 1 文字が 1 マス（地形の symbol）。座標は左上が (0, 0) で、x は右、y は下に増える
# ai は charge（突っ込む）・hold（待ち構える）のどれか

[[maps]]
id = "ch01"
name = "国境の砦"
rows = [
  "^^^^^^..FFF..^^^", # y 0
  "^^^^...FF....T^^", # y 1
  "^^.....F....###.", # y 2
  ".....FF.....#...", # y 3
  "..T..F......#...", # y 4
  "....FF..^^......", # y 5
  ".......^^^..FF..", # y 6
  "..FF....^...FF..", # y 7
  "..FF.........T..", # y 8
  ".....^^.........", # y 9
  "....^^^..FF.....", # y 10
  ".........FF..^^.", # y 11
  "..FF............", # y 12
  "..FF...^^.......", # y 13
  "........^.......", # y 14
  "................", # y 15
]
allies = [
  { character = "leon", x = 1, y = 14 },
  { character = "gald", x = 2, y = 13 },
  { character = "bran", x = 3, y = 14 },
  { character = "mira", x = 1, y = 15 },
]

[[maps.enemies]]
