  "..T..F......#...", # y 4
  "....FF..^^......", # y 5
  ".......^^^..FF..", # y 6
  "..FF....^...FF..", # y 7
  "..FF.........T..", # y 8
  ".....^^.........", # y 9
  "....^^^..FF.....", # y 10
  ".........FF..^^.", # y 11
  "..FF............", # y 12
  "..FF...^^.......", # y 13
  "........^.......", # y 14
  "................", # y 15
]
# 出撃の枠（反復 1 の自軍の配置と同じ座標を同じ順に並べ、5 番目に (2, 15) を足した。設計書（反復 2）10.4 節）
slots = [
  { x = 1, y = 14 },
  { x = 2, y = 13 },
