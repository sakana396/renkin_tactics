# マップ（DES-DAT-02、設計書（反復 1）10.4 節、設計書（反復 2）10.4〜10.6 節）
# rows の 1 文字が 1 マス（地形の symbol）。座標は左上が (0, 0) で、x は右、y は下に増える
# slots は出撃の枠の並び。1 番目は主人公の枠
# ai は charge（突っ込む）・hold（待ち構える）のどれか。name は敵の名前（省略すると、クラスの名前から付ける）

[[maps]]
id = "ch01"
name = "国境の砦"
rows = [
  "^^^^^^..FFF..^^^", # y 0
  "^^^^...FF....T^^", # y 1
  "^^.....F....###.", # y 2
  ".....FF.....#...", # y 3
  "..T..F......#...", # y 4
  "....FF..^^......", # y 5
  ".......^^^..FF..", # y 6
  "..FF....^...FF..", # y 7
  "..FF.........T..", # y 8
  ".....^^.........", # y 9
  "....^^^..FF.....", # y 10
  ".........FF..^^.", # y 11
  "..FF............", # y 12
  "..FF...^^.......", # y 13
  "........^.......", # y 14
  "................", # y 15
]
# 出撃の枠（反復 1 の自軍の配置と同じ座標を同じ順に並べ、5 番目に (2, 15) を足した。設計書（反復 2）10.4 節）
slots = [
  { x = 1, y = 14 },
  { x = 2, y = 13 },
  { x = 3, y = 14 },
  { x = 1, y = 15 },
  { x = 2, y = 15 },
]

[[maps.enemies]]
class = "soldier"
weapon = "iron_lance"
ai = "charge"
x = 6
y = 10

[[maps.enemies]]
class = "soldier"
weapon = "iron_lance"
ai = "hold"
x = 7
y = 4

[[maps.enemies]]
