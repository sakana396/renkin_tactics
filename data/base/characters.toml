# 自軍のキャラ（DES-DAT-02、設計書（反復 2）10.3 節）
# 能力はクラスの base に bonus を足したもの。bonus は負の値も書ける（足したあとの値を検証する）
# level は加わるときのレベル（省略すると 1）。growth は成長率（%。省略した能力は 0）

[[characters]]
id = "leon"
name = "レオン"
class = "lord"
bonus = { hp = 1, str = 2, skl = 4, spd = 4, def = 0, mov = 0 }
growth = { hp = 55, str = 45, skl = 65, spd = 70, def = 20, lck = 40, mag = 20, res = 20 }
weapon = "iron_sword"
items = [{ item = "potion", count = 2 }]
skill = "inspire"
lord = true

