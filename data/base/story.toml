# 物語（DES-DAT-02 の反復 2 の変更、設計書（反復 2）10.8 節。下書きで、開発者の確認を待っている）
# paragraphs の 1 つが 1 段落。各段落は空でなく、200 文字以下

[[stories]]
id = "ch01_before"
paragraphs = [
  "小国アルケアは、錬金術の工房で知られる国だった。山と森に守られ、長く戦を知らなかった。",
  "その春、大国ヴァルト帝国が国境を越えた。狙いは、工房の技と、山の奥に眠る鉱石だという。",
  "国境の守備隊を率いる若い隊長レオンは、見回りから戻る途中で、砦に帝国の旗が上がるのを見た。砦に残っていた兵の多くは、もう生きていない。",
  "隊には、砦へ薬を届けに来ていた工房の見習い、リナもいた。癒やしの杖を握る手は震えていたが、引き返すとは言わなかった。",
  "ガルド「隊長、砦の守りは固い。だが、取り返さねば、この先の村が焼かれる」",
  "レオン「行こう。守将ハーゲンを討てば、先遣隊は崩れる」",
]

[[stories]]
id = "ch01_after"
paragraphs = [
  "砦の上に、再びアルケアの旗が上がった。だが、喜ぶ者はいなかった。中庭には、名も知らぬ兵たちが並べて寝かされていた。",
  "夜、王都から早馬が来た。帝国の本隊が別の道から王都に迫り、王都は三日ともたずに落ちたという。",
  "若い兵が「王様は……」とつぶやいた。使者は首を振った。",
  "生き残った兵と工房の錬金術士たちは、散り散りに西の谷へ逃れている。",
  "レオン「砦を捨てる。ここに残れば、帝国の本隊に飲まれるだけだ。西へ退き、兵を集め直す」",
]

[[stories]]
id = "ch02_before"
paragraphs = [
  "西の谷へ向かう街道は、逃げる人々で埋まっていた。後ろからは帝国の追っ手が迫り、前では帝国の騎兵が道をふさいでいる。",
  "その夜、一人の帝国の騎士が、白い布を掲げて陣を訪れた。帝国の騎兵隊長、エルザと名乗った。",
  "エルザ「村を焼けという命令に、従えなかった。この戦は、錬金術の技を奪うための略奪だ。剣を向ける相手を、選び直したい」",
  "古参の兵「信じろってのか。昨日まで俺たちを追っていた奴を」",
  "レオン「信じるかどうかは、明日の戦いで決める。道をふさぐ隊長ヴォルグを討つ。力を貸してくれ」",
]

[[stories]]
id = "ch02_after"
paragraphs = [
  "ヴォルグが倒れると、帝国の騎兵は散っていった。逃げる人々の列は、ようやく谷の奥へと流れ始めた。",
  "倒れた帝国の騎兵たちも、もとはどこかの村の若者だった。レオンは、敵の亡骸にも布をかけさせた。",
  "谷には、各地から逃れた兵と錬金術士が集まっていた。工房の長は、残った薬と道具をすべて差し出すと言った。",
  "レオン「王都を取り戻す。侵攻軍の総大将を討てば、帝国はこの国にとどまる理由を失う」",
]

[[stories]]
id = "ch03_before"
paragraphs = [
  "集まった兵は、守備隊を合わせても百に満たなかった。王都の城門の前には、その何倍もの帝国兵が陣を敷いている。",
  "捕らえた帝国兵の話では、総大将グラウスは城の奥の玉座の間にいる。自ら剣を取る男で、近づけば必ず出てくるという。",
  "レオン「数では勝てない。狙うのは一人だ」",
  "夜明けとともに、レオンたちは崩れた城壁の隙間から王都に入った。",
]

[[stories]]
id = "ch03_after"
paragraphs = [
  "グラウスが倒れると、王都の帝国兵は武器を捨てた。玉座の間に、ようやく静けさが戻った。",
  "だが、侵攻軍のすべてが王都にいたわけではなかった。城外に陣を敷いていた本隊は、総大将の死を知ると、隊列を崩さずに東へ退いていった。",
  "捕らえた帝国の将校「本隊は国境の関門、ヴァルトの門へ向かった。本国の援軍が着けば、もう一度この国へ攻め込む」",
  "工房の長「あの門は、帝国がこの国へ攻め込むために築いた砦だ。あそこが帝国の手にある限り、戦は終わらない」",
  "レオン「王都は取り戻した。だが、まだ何も終わっていない。援軍が着く前に、門を落とす」",
]

# 9 章（DES-IT05 3.3 節、DES-CMP-09）。結末は ch09_after（反復 2 までの ch03_after の結びをここへ移した）


# DES-CMP-09
[[stories]]
id = "ch04_before"
paragraphs = [
  "王都を出て東へ向かうと、空の低いところに煙が横たわっていた。ヴァルトの門へ退く帝国軍の後衛が、街道沿いの村を焼いていた。",
  "井戸には割れた桶が転がり、焼け残った壁の陰で、村人たちが息を潜めていた。逃げ道の両側から、まだ帝国兵が近づいてくる。",
  "村の老人「後衛を率いているのは、オスカーという男だ。あの隊が残れば、次の村にも火がかかる」",
  "レオンは煙の向こうを見た。門を急ぐあいだにも、守れなかった家が増えていく。後衛を指揮するオスカーを討ち、村を抜ける。",
]

# DES-CMP-09
[[stories]]
id = "ch04_after"
paragraphs = [
  "オスカーが倒れると、後衛は村の北へ逃げた。兵たちは剣を収め、井戸から水をくみ上げた。火が消えても、家の形は戻らなかった。",
  "村の女が、焦げた戸板の下から小さな鍋を拾った。「これがあれば、明日の分は炊ける」。礼を言う声より、その手の震えがレオンには残った。",
  "兵の一人「先の関所にも、まだ敵が残っているそうです。追うなら、ここで隊を整えましょう」",
  "夜明け、村人たちは関所へ続く細道を教えた。レオンたちは残った薬を分け、煙の立つ村を背にした。",
]

# DES-CMP-09
[[stories]]
id = "ch05_before"
paragraphs = [
  "山と山の狭間に、小さな関所があった。退く荷車を通した門は閉ざされ、弓を持つ兵が壁の向こうに並んでいた。",
  "守備隊長ディートリヒは、逃げ遅れた後衛を待っている。関所を押さえられたままでは、追撃の隊も山道へ進めない。",
  "斥候の兵が戻ってきた。「壁の切れ目の先に槍、その後ろに弓兵がいます。森に埋もれた脇の通路にも、人の足跡がありました」",
  "レオン「ディートリヒを討って、山道への出口を開く。全員で入れる広さじゃない。出る者を決めよう」",
]

# DES-CMP-09
[[stories]]
id = "ch05_after"
paragraphs = [
  "ディートリヒが倒れ、関所の門が開いた。中に積まれていた荷はすでに少なく、大半は山の向こうへ運び出されていた。",
  "兵の一人が空の木箱を蹴ろうとして、足を止めた。箱の底には、アルケアの工房の焼き印があった。",
  "兵「盗られたものも、燃えたものも、全部は戻らないんですね」。レオンは答えず、箱を道の端へ運んだ。",
  "関所の上からは、山腹を曲がる街道が見えた。遠くの尾根を、帝国の騎兵が越えていく。追う隊は、山道へ足を踏み入れた。",
]

# DES-CMP-09
[[stories]]
id = "ch06_before"
paragraphs = [
  "山道は谷に沿って折れ曲がり、見上げる岩棚には帝国の弓兵がいた。道が広がるところだけ、騎兵の蹄の跡が深く残っている。",
  "山道を守るロルフの隊は、退く本隊との間を切らせまいとしていた。道中の古い砦にも、帝国の旗が上がっている。",
  "坂の途中で、レオンは隊の後ろを振り返った。足の速い者ほど前へ出て、杖を持つ者との間が開き始めていた。先へ行きすぎれば、傷を治す手が届かなくなる。",
  "レオン「尾根の指揮所にいるロルフを討つ。足を止めれば援軍に挟まれる。互いの姿が見えるうちに進もう」",
]

# DES-CMP-09
[[stories]]
id = "ch06_after"
paragraphs = [
  "ロルフの旗が下がると、岩棚の弓兵も山を下り始めた。谷を吹く風が、ようやく弓弦の音を運ばなくなった。",
  "尾根の向こうには、ヴァルトの門へ続く平野が広がっていた。だが門へ向かうのは兵だけではない。遠い道に、荷車の列が見える。",
  "道案内の猟師「本国からの補給です。あれが門に入れば、籠もった本隊はさらに長く持ちこたえます」。兵たちは黙って水筒を閉じた。",
  "レオン「先に荷駄の道を断つ。それから、門の前の森を抜ける」。兵たちは最後の坂を下りた。王都から続いた煙は、もう山に隠れて見えなかった。",
]

[[stories]]
id = "ch09_before"
paragraphs = [
  "ヴァルトの門は、二つの山のあいだをふさぐ帝国の砦だった。外の城壁の向こうに前庭があり、その奥の本営に、本隊の将ゲルハルトが陣取っている。",
  "門へ続く道は、中ほどの尾根で西と東に分かれている。西は森と山の細い道、東は崩れた壁の残る広い街道だ。二つの道は、外の城壁の内側の前庭で一つになる。",
  "斥候の兵「東の街道には騎兵が待っています。広い道は騎兵の足を速くします。西の森は歩みが遅いですが、山の上から弓兵が狙ってきます」",
  "レオンは地図の上で、二つの道を指でなぞった。隊を分けるか、まとめて一つの道を行くか。分ければ前庭で挟めるが、片方が崩れれば、もう片方も持たない。",
  "レオン「援軍が着くまで、時はない。狙うのはゲルハルト一人だ。門を抜けて、本営へ行く」",
]

[[stories]]
id = "ch09_after"
paragraphs = [
  "ゲルハルトが倒れると、門を守る帝国兵は武器を捨てた。将を失った本隊は、国境の向こうへ退いていった。本国の援軍も、門が落ちたと知ると引き返したという。",
  "王都の広場には、生き残った人々が集まり、亡くなった者の名を一人ずつ読み上げた。その声は、日が暮れても終わらなかった。",
  "レオン「勝ったんじゃない。終わらせただけだ」",
  "帝国との戦がこれで終わるのかは、まだ誰にも分からない。それでも、工房の煙突から、久しぶりに煙が上がった。",
]
