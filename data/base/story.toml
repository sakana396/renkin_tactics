# 物語（DES-DAT-02 の反復 2 の変更、設計書（反復 2）10.8 節。下書きで、開発者の確認を待っている）
# paragraphs の 1 つが 1 段落。各段落は空でなく、200 文字以下

[[stories]]
id = "ch01_before"
paragraphs = [
  "小国アルケアは、錬金術の工房で知られる国だった。山と森に守られ、長く戦を知らなかった。",
  "その春、大国ヴァルト帝国が国境を越えた。狙いは、工房の技と、山の奥に眠る鉱石だという。",
  "国境の守備隊を率いる若い隊長レオンは、見回りから戻る途中で、砦に帝国の旗が上がるのを見た。砦に残っていた兵の多くは、もう生きていない。",
  "隊には、砦へ薬を届けに来ていた工房の見習い、リナもいた。癒やしの杖を握る手は震えていたが、引き返すとは言わなかった。",
  "ガルド「隊長、砦の守りは固い。だが、取り返さねば、この先の村が焼かれる」",
  "レオン「行こう。守将ハーゲンを討てば、先遣隊は崩れる」",
]

[[stories]]
id = "ch01_after"
paragraphs = [
  "砦の上に、再びアルケアの旗が上がった。だが、喜ぶ者はいなかった。中庭には、名も知らぬ兵たちが並べて寝かされていた。",
  "夜、王都から早馬が来た。帝国の本隊が別の道から王都に迫り、王都は三日ともたずに落ちたという。",
  "若い兵が「王様は……」とつぶやいた。使者は首を振った。",
  "生き残った兵と工房の錬金術士たちは、散り散りに西の谷へ逃れている。",
  "レオン「砦を捨てる。ここに残れば、帝国の本隊に飲まれるだけだ。西へ退き、兵を集め直す」",
]

[[stories]]
id = "ch02_before"
paragraphs = [
  "西の谷へ向かう街道は、逃げる人々で埋まっていた。後ろからは帝国の追っ手が迫り、前では帝国の騎兵が道をふさいでいる。",
  "その夜、一人の帝国の騎士が、白い布を掲げて陣を訪れた。帝国の騎兵隊長、エルザと名乗った。",
  "エルザ「村を焼けという命令に、従えなかった。この戦は、錬金術の技を奪うための略奪だ。剣を向ける相手を、選び直したい」",
  "古参の兵「信じろってのか。昨日まで俺たちを追っていた奴を」",
  "レオン「信じるかどうかは、明日の戦いで決める。道をふさぐ隊長ヴォルグを討つ。力を貸してくれ」",
]

[[stories]]
id = "ch02_after"
paragraphs = [
  "ヴォルグが倒れると、帝国の騎兵は散っていった。逃げる人々の列は、ようやく谷の奥へと流れ始めた。",
  "倒れた帝国の騎兵たちも、もとはどこかの村の若者だった。レオンは、敵の亡骸にも布をかけさせた。",
  "谷には、各地から逃れた兵と錬金術士が集まっていた。工房の長は、残った薬と道具をすべて差し出すと言った。",
  "レオン「王都を取り戻す。侵攻軍の総大将を討てば、帝国はこの国にとどまる理由を失う」",
]

[[stories]]
id = "ch03_before"
paragraphs = [
  "集まった兵は、守備隊を合わせても百に満たなかった。王都の城門の前には、その何倍もの帝国兵が陣を敷いている。",
  "捕らえた帝国兵の話では、総大将グラウスは城の奥の玉座の間にいる。自ら剣を取る男で、近づけば必ず出てくるという。",
  "レオン「数では勝てない。狙うのは一人だ」",
  "夜明けとともに、レオンたちは崩れた城壁の隙間から王都に入った。",
]

[[stories]]
id = "ch03_after"
paragraphs = [
  "グラウスが倒れると、王都の帝国兵は武器を捨てた。玉座の間に、ようやく静けさが戻った。",
  "だが、侵攻軍のすべてが王都にいたわけではなかった。城外に陣を敷いていた本隊は、総大将の死を知ると、隊列を崩さずに東へ退いていった。",
  "捕らえた帝国の将校「本隊は国境の関門、ヴァルトの門へ向かった。本国の援軍が着けば、もう一度この国へ攻め込む」",
  "工房の長「あの門は、帝国がこの国へ攻め込むために築いた砦だ。あそこが帝国の手にある限り、戦は終わらない」",
  "レオン「王都は取り戻した。だが、まだ何も終わっていない。援軍が着く前に、門を落とす」",
]

# 9 章（DES-IT05 3.3 節、DES-CMP-09）。結末は ch09_after（反復 2 までの ch03_after の結びをここへ移した）

[[stories]]
id = "ch09_before"
paragraphs = [
  "ヴァルトの門は、二つの山のあいだをふさぐ帝国の砦だった。外の城壁の向こうに前庭があり、その奥の本営に、本隊の将ゲルハルトが陣取っている。",
  "門へ続く道は、中ほどの尾根で西と東に分かれている。西は森と山の細い道、東は崩れた壁の残る広い街道だ。二つの道は、外の城壁の内側の前庭で一つになる。",
  "エルザ「東の街道には騎兵が待っている。広い道は騎兵の足を速くする。西の森は歩みが遅いが、山の上から弓兵が狙ってくる」",
  "ガルド「隊を分けるか、まとめて一つの道を行くか。分ければ前庭で挟めるが、片方が崩れれば、もう片方も持たない」",
  "レオン「援軍が着くまで、時はない。狙うのはゲルハルト一人だ。門を抜けて、本営へ行く」",
]

[[stories]]
id = "ch09_after"
paragraphs = [
  "ゲルハルトが倒れると、門を守る帝国兵は武器を捨てた。将を失った本隊は、国境の向こうへ退いていった。本国の援軍も、門が落ちたと知ると引き返したという。",
  "王都の広場には、生き残った人々が集まり、亡くなった者の名を一人ずつ読み上げた。その声は、日が暮れても終わらなかった。",
  "レオン「勝ったんじゃない。終わらせただけだ」",
  "帝国との戦がこれで終わるのかは、まだ誰にも分からない。それでも、工房の煙突から、久しぶりに煙が上がった。",
]
