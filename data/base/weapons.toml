# 武器（DES-DAT-02、設計書 10.2 節）
# type は sword・lance・axe・bow・staff のどれか
# 杖（staff）は heal（回復量）と uses（使用回数）を 1 以上で書き、might・hit は書かない（0）。杖でない武器は heal・uses を書かない

[[weapons]]
id = "iron_sword"
name = "鉄の剣"
type = "sword"
might = 5
hit = 90
min_range = 1
max_range = 1

[[weapons]]
id = "iron_lance"
name = "鉄の槍"
type = "lance"
might = 7
hit = 80
min_range = 1
max_range = 1

[[weapons]]
id = "iron_axe"
name = "鉄の斧"
type = "axe"
might = 8
hit = 70
min_range = 1
max_range = 1

# 隣のマスには攻撃できない
[[weapons]]
id = "iron_bow"
name = "鉄の弓"
type = "bow"
might = 6
hit = 85
min_range = 2
max_range = 2

# 癒やしの杖（設計書（反復 2）10.1・10.2 節、DES-HEL-01）。章ごとに満タンで始まる
[[weapons]]
id = "heal_staff"
name = "癒やしの杖"
type = "staff"
heal = 10
uses = 15
min_range = 1
max_range = 1
